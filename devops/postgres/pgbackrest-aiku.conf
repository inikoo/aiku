# pgBackRest for the aiku production database (INI-113): continuous WAL archiving
# from boro to Cloudflare R2, and a weekly full + daily incremental backup taken
# from litio's replica. Restores to any chosen minute, from outside Hetzner.
#
# Same file on BORO and LITIO at /etc/pgbackrest/pgbackrest.conf (root:postgres 640).
# On litio keep the [aiku] block marked LITIO, on boro the one marked BORO.
#
# The R2 key lives in its own file, typed in by Raul, never in the repo:
#     /etc/pgbackrest/conf.d/r2.conf   (root:postgres 640)
#         [global]
#         repo1-s3-key=...
#         repo1-s3-key-secret=...
# Bucket aiku-pgbackrest, EU jurisdiction, private. Token: Object Read & Write on
# that bucket only, IP filter boro + litio:
#     65.109.156.60  2a01:4f9:3080:1324::/64   (boro)
#     65.109.156.59  2a01:4f9:3080:1325::/64   (litio)
# Bucket lock: 7 days on the WAL folder aiku/archive/aiku/18-1/ only (a new
# PostgreSQL major version starts a new folder, which needs its own rule).
# pgBackRest rewrites archive.info (one level up), backup.info and backup
# manifests in place, so a lock on the whole bucket breaks it; 7 days because
# retention-full=2 expires WAL once it is a week older than the newest full.
#
# Order (each step as root, the PostgreSQL restart only at a quiet hour):
#  1. both:  apt install pgbackrest      (creates /var/log/pgbackrest and /var/spool/pgbackrest;
#                                         its sample /etc/pgbackrest.conf is ignored once
#                                         /etc/pgbackrest/pgbackrest.conf exists)
#            install -d -m 750 -g postgres /etc/pgbackrest/conf.d
#            install -m 640 -g postgres devops/postgres/pgbackrest-aiku.conf /etc/pgbackrest/pgbackrest.conf
#            (and write /etc/pgbackrest/conf.d/r2.conf as above)
#  2. litio reaches boro's PostgreSQL files over ssh as postgres (backup-standby
#     copies from litio but starts and stops the backup on boro):
#        litio:  runuser -u postgres -- install -d -m 700 /var/lib/postgresql/.ssh
#                runuser -u postgres -- ssh-keygen -q -t ed25519 -N '' -C postgres@litio-pgbackrest -f /var/lib/postgresql/.ssh/id_ed25519
#        boro:   append litio's id_ed25519.pub to /var/lib/postgresql/.ssh/authorized_keys (700/600, postgres) as
#                restrict,from="10.0.0.1" ssh-ed25519 AAAA... postgres@litio-pgbackrest
#        litio:  runuser -u postgres -- ssh -o StrictHostKeyChecking=accept-new 10.0.0.3 pgbackrest version
#  3. boro:  runuser -u postgres -- pgbackrest --stanza=aiku stanza-create
#  4. boro:  ALTER SYSTEM SET archive_mode = 'on';
#            ALTER SYSTEM SET archive_command = 'pgbackrest --stanza=aiku archive-push %p';
#            systemctl restart postgresql@18-main          (10-30 s; archive_mode needs a restart)
#            runuser -u postgres -- pgbackrest --stanza=aiku check
#            then record both settings in devops/postgres/boro-production.conf
#  5. litio: runuser -u postgres -- pgbackrest --stanza=aiku --type=full backup
#            install -m 644 devops/cron/pgbackrest-aiku /etc/cron.d/pgbackrest-aiku
#  6. Restore to a chosen minute on a temporary server (as INI-087), with a read-only
#     token: --type=time "--target=2026-10-24 10:15:00+00" --target-action=promote.
#     On that server, before deleting it, prove the disk guard: point repo1 at a
#     bucket the token cannot write, set archive-push-queue-max=1GB, write WAL
#     (pgbench -i -s 200) and see pg_wal stay near 1 GB with "dropped WAL" warnings
#     in /var/log/pgbackrest/aiku-archive-push-async.log.
#
# Check by hand:  runuser -u postgres -- pgbackrest --stanza=aiku info
# Alerting: MonitorDatabaseReplicas (every 5 min) alerts Discord when no WAL has
# been archived for 15 minutes; the cron on litio alerts when a backup fails.

[global]
repo1-type=s3
repo1-s3-endpoint=8c8a97c6d4117196e5275c09a53bf8ea.eu.r2.cloudflarestorage.com
repo1-s3-bucket=aiku-pgbackrest
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-path=/aiku
repo1-retention-full=2
repo1-bundle=y
repo1-block=y

compress-type=zst
process-max=4
start-fast=y
log-level-console=warn
log-level-file=info
spool-path=/var/spool/pgbackrest

archive-async=y
# A broken upload drops WAL past 50 GB instead of filling boro's disk and
# stopping production. Point-in-time recovery then has a gap until the next full.
archive-push-queue-max=50GB

# BORO
[aiku]
pg1-path=/var/lib/postgresql/18/main

# LITIO
# [aiku]
# pg1-host=10.0.0.3
# pg1-path=/var/lib/postgresql/18/main
# pg2-path=/var/lib/postgresql/18/main
# backup-standby=y
