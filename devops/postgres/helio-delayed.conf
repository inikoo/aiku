# Delayed standby of boro on helio (INI-071): WAL arrives at once and is applied
# 12 hours late, so a bad DELETE, UPDATE or DROP on production can be caught here
# before it lands. Its own cluster, port 5435, next to main/ci/archive.
# Place at /etc/postgresql/18/delayed/conf.d/99-helio-delayed.conf
#
# Build (root on helio; pg_basebackup creates the slot on boro itself, and reads
# the replicator password from ~postgres/.pgpass). The private link between the
# servers is 1 Gbit/s (about 115 MB/s) and litio's app already pulls 40 to 60 MB/s
# of query results over it, even on a Sunday at dawn, hence the 40 MB/s cap: about
# two hours for 300 GB. Measure the link before raising it.
#     pg_createcluster 18 delayed -p 5435
#     rm -rf /var/lib/postgresql/18/delayed
#     sudo -u postgres pg_basebackup -h 10.0.0.3 -U replicator -w -D /var/lib/postgresql/18/delayed \
#         -X stream -C -S replica_helio_delayed -R --max-rate=40M -P
#     install -m 644 -o postgres devops/postgres/helio-delayed.conf /etc/postgresql/18/delayed/conf.d/99-helio-delayed.conf
#     pg_ctlcluster 18 delayed start
#
# When something bad has run on production, FIRST stop this replica from reaching it:
#     sudo -u postgres psql -p 5435 -c "select pg_wal_replay_pause()"
# then copy the rows back from here (pg_dump -p 5435 -t table, or \copy). To move it
# forward to just before the mistake, set recovery_target_time and restart it.
# Resume with pg_wal_replay_resume().
#
# The slot cannot fill boro: max_slot_wal_keep_size there is 100 GB. Boro writes
# about 45 GB of WAL per 12 hours, which is what waits in pg_wal here.

listen_addresses = 'localhost'

recovery_min_apply_delay = '12h'
hot_standby = on
hot_standby_feedback = off
max_standby_streaming_delay = -1
max_standby_archive_delay = -1

max_connections = 1000
max_worker_processes = 51
max_locks_per_transaction = 1024
max_wal_senders = 10
max_prepared_transactions = 0

shared_buffers = 2GB
max_wal_size = 32GB
checkpoint_timeout = 30min
jit = off
timezone = 'UTC'
log_timezone = 'UTC'
