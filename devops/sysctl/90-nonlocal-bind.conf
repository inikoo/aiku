# Postgres and the queue Redis bind the vSwitch address (10.0.0.x). netplan's
# wait-online runs with --any, so network-online.target is reached once the
# public NIC is routable, before the vSwitch address exists: after the 24 Oct
# 2026 reboot litio's replica came up on localhost only and every MCP SQL query
# was refused (HELP-4289). This lets them bind the address before it is up.
net.ipv4.ip_nonlocal_bind = 1
